spring.application.name=calendaradmin

# Tomcat
server.port=8091

# Dev Tools
spring.devtools.restart.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/DB_CALENDAR
spring.datasource.username=root
spring.datasource.password=1234

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hohasic@gmail.com
spring.mail.password=frgwshxafkeucqis
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# log4j2
logging.config=classpath:logger/log4j2.xml

# Mybatis
mybatis.config-location=classpath:mybatis/config/mybatis-config.xml
mybatis.mapper-locations=classpath:mybatis/mappers/*.xml

# JPA
# MySQL 버전에 맞는 Dialect를 사용하도록 설정합니다.
# Dialect는 데이터베이스와 통신할 때 사용할 SQL 문법과 기능을 정의하는 역할을 하는 것으로
# 지금은 MySQL SQL 문법을 사용하도록 정의합니다.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 테이블 자동 생성 설정으로 만약 테이블이 없다면 새로 생성하고,
# 기존 테이블이 있다면 테이블 구조가 엔티티 클래스에 맞게 변경됩니다.
# 즉, 테이블이 이미 존재하면 생성하지 않고, 필요 부분만 변경합니다.
# 지금은 주석 처리해서 지금까지 사용한 테이블을 그대로 사용하기로 합니다.
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL문을 콘솔에 출력하도록 설정합니다.
spring.jpa.show-sql=true

# SQL문을 보기 좋게 출력하도록 설정합니다.
spring.jpa.properties.hibernate.format_sql=true